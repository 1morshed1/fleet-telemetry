syntax = "proto3";

package fleet.v1;

option go_package = "github.com/1morshed1/fleet-telemetry/proto/fleet/v1;fleetv1";

// FleetIngestion is the entry point for GPS devices (or the simulator standing in
// for them). Devices open a single long-lived bidirectional stream and push pings
// continuously; the server streams back per-batch acknowledgements. Using one
// stream per device avoids a TCP/HTTP handshake per ping.
service FleetIngestion {
  // StreamPings is a bidirectional stream: the client sends GPSPing messages,
  // the server replies with PingAck messages. The server may set accepted=false
  // to apply backpressure when it cannot keep up (see docs/03-ingestion.md).
  rpc StreamPings(stream GPSPing) returns (stream PingAck);
}

// GPSPing is one position report from one vehicle at one instant.
message GPSPing {
  string vehicle_id = 1;
  double latitude = 2;
  double longitude = 3;
  double speed_kmh = 4;   // speed the device reports (may include sensor noise)
  double heading = 5;     // degrees, 0 = north, clockwise
  int64 timestamp_unix_ms = 6;
}

// PingAck is the server's response. One ack is returned per received ping (keyed
// by sequence) so the client can detect rejection and back off.
message PingAck {
  string vehicle_id = 1;
  bool accepted = 2;
  string reason = 3;   // human-readable rejection reason when accepted=false
}
