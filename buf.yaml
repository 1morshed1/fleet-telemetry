version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # We intentionally keep domain names (GPSPing, PingAck, FleetIngestion)
    # instead of the StreamPingsRequest/Response convention — clearer for readers.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
