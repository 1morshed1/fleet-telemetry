<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Telemetry — Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a7;
            --accent:#4da3ff; --violation:#ff5c5c; --ok:#39d98a; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
                 font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #app { display:flex; height:100%; }
    #map { flex:1; }
    #side { width:340px; max-width:45%; background:var(--panel); border-left:1px solid var(--line);
            display:flex; flex-direction:column; }
    header { padding:14px 16px; border-bottom:1px solid var(--line); }
    header h1 { font-size:16px; margin:0 0 4px; }
    header .sub { color:var(--muted); font-size:12px; }
    .stats { display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
    .stat { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
    .stat .n { font-size:20px; font-weight:700; }
    .stat .l { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
    .stat.viol .n { color:var(--violation); }
    .feed { flex:1; overflow:auto; padding:8px 12px; }
    .feed h2 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 4px; }
    .alert { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; font-size:13px; }
    .alert.speed { border-left:3px solid #ffb020; }
    .alert.geofence { border-left:3px solid var(--violation); }
    .alert .who { font-weight:600; }
    .alert .when { color:var(--muted); font-size:11px; }
    #status { font-size:11px; color:var(--muted); padding:8px 16px; border-top:1px solid var(--line); }
    #status.live::before { content:"● "; color:var(--ok); }
    #status.down::before { content:"● "; color:var(--violation); }
    .leaflet-container { background:#0b0d11; }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <aside id="side">
      <header>
        <h1>Fleet Telemetry</h1>
        <div class="sub">Live vehicle positions · geofences · alerts</div>
      </header>
      <div class="stats">
        <div class="stat"><div class="n" id="stat-vehicles">0</div><div class="l">Vehicles</div></div>
        <div class="stat viol"><div class="n" id="stat-violations">0</div><div class="l">In violation</div></div>
        <div class="stat"><div class="n" id="stat-alerts">0</div><div class="l">Alerts</div></div>
      </div>
      <div class="feed">
        <h2>Recent alerts</h2>
        <div id="alerts"></div>
      </div>
      <div id="status" class="down">connecting…</div>
    </aside>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
