# Full local stack: infrastructure (Redpanda, TimescaleDB, Redis, Prometheus,
# Grafana) plus the three long-running services (ingestion, processor, dashboard).
# The simulator is run separately (`make simulate`) so you control the load.
#
#   make up       # build + start everything
#   make simulate # push load in
#   http://localhost:8080  (map)   http://localhost:3000 (grafana)

name: fleet-telemetry

services:
  # ---------------- Infrastructure ----------------

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # host access for rpk/debugging (services use redpanda:9092)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pre-create topics with a fixed partition count. Partitioning by
  # vehicle_id needs multiple partitions to allow processor scale-out.
  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create gps-pings -p 6 -r 1 --brokers redpanda:9092 || true
        rpk topic create speed-alerts -p 3 -r 1 --brokers redpanda:9092 || true
        rpk topic create geofence-alerts -p 3 -r 1 --brokers redpanda:9092 || true
    restart: "no"

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5433:5432" # host:container — 5433 avoids clashing with a local Postgres
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - tsdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- Services ----------------

  ingestion:
    build: .
    command: ["ingestion"]
    environment:
      GRPC_ADDR: ":50051"
      METRICS_ADDR: ":2112"
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "50051:50051" # gRPC (simulator connects here)
      - "2112:2112"   # metrics
    depends_on:
      redpanda:
        condition: service_healthy

  processor:
    build: .
    command: ["processor"]
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_GROUP: "fleet-processor"
      DATABASE_URL: "postgres://fleet:fleet@timescaledb:5432/fleet"
      REDIS_ADDR: "redis:6379"
      METRICS_ADDR: ":2113"
    ports:
      - "2113:2113" # metrics
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build: .
    command: ["dashboard"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://fleet:fleet@timescaledb:5432/fleet"
      REDIS_ADDR: "redis:6379"
      WEB_DIR: "/app/web"
      BROADCAST_INTERVAL: "1s"
    ports:
      - "8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------- Observability ----------------

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  tsdata:
