# Prometheus scrape config for the fleet stack. Each Go service exposes
# /metrics; Prometheus pulls them on an interval and Grafana graphs them.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:2112"]

  - job_name: processor
    static_configs:
      - targets: ["processor:2113"]
