apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet

resources:
  - ../../base

# Prod overlay: more replicas for the stateless services and higher HPA ceiling.
# (Stateful infra here is still single-node for the demo; real prod swaps in
#  operators/managed services — see infra.yaml comments.)
patches:
  - target: { kind: Deployment, name: ingestion }
    patch: |
      - { op: replace, path: /spec/replicas, value: 3 }
  - target: { kind: Deployment, name: processor }
    patch: |
      - { op: replace, path: /spec/replicas, value: 3 }
  - target: { kind: Deployment, name: dashboard }
    patch: |
      - { op: replace, path: /spec/replicas, value: 2 }
  - target: { kind: HorizontalPodAutoscaler, name: ingestion }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 3 }
      - { op: replace, path: /spec/maxReplicas, value: 20 }
