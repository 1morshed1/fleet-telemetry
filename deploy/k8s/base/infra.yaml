# Single-node infra for a learning/dev cluster. In production you would NOT run
# these as hand-rolled manifests: use the Strimzi operator for Kafka, the
# TimescaleDB / CloudNativePG operator (or managed RDS) for Postgres, and a Redis
# operator or managed Redis. These are here so `kubectl apply -k` gives a working
# cluster on Minikube without extra operators.

# ---------------- Redpanda (Kafka API) ----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: { app: redpanda }
  template:
    metadata:
      labels: { app: redpanda }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
          ports:
            - { containerPort: 9092 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  clusterIP: None
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
---
# ---------------- TimescaleDB ----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels: { app: timescaledb }
  template:
    metadata:
      labels: { app: timescaledb }
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb-ha:pg16
          env:
            - { name: POSTGRES_USER, value: fleet }
            - { name: POSTGRES_PASSWORD, value: fleet }
            - { name: POSTGRES_DB, value: fleet }
          ports:
            - { containerPort: 5432 }
          volumeMounts:
            - { name: pgdata, mountPath: /home/postgres/pgdata/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: db-init }
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
spec:
  selector: { app: timescaledb }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
# ---------------- Redis ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { containerPort: 6379 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
