apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: { app: dashboard }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: fleet-telemetry:latest
          args: ["dashboard"]
          env:
            - { name: HTTP_ADDR, value: ":8080" }
            - { name: DATABASE_URL, value: "postgres://fleet:fleet@timescaledb:5432/fleet" }
            - { name: REDIS_ADDR, value: "redis:6379" }
            - { name: WEB_DIR, value: "/app/web" }
            - { name: BROADCAST_INTERVAL, value: "1s" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: { app: dashboard }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
# Ingress exposes the dashboard. Assumes an ingress controller (e.g. nginx).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # long-lived WebSocket
spec:
  rules:
    - host: fleet.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port: { number: 80 }
